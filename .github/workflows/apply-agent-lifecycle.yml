name: Apply Slides Agent Lifecycle Fix

"on":
  push:
    branches: [dev_agent_lifecycle_apply]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Confirm regression reproduces before fix
        shell: bash
        run: |
          set +e
          npm test -w @genoffice/slides -- ai-panel-run-lifecycle.test.ts 2>&1 | tee /tmp/slides-lifecycle-baseline.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected lifecycle regression test to fail before the production fix"
            exit 1
          fi
          grep -q '2 failed' /tmp/slides-lifecycle-baseline.log
          grep -q 'persists a successful tool-only run' /tmp/slides-lifecycle-baseline.log
          grep -q 'keeps readable images and continues the run' /tmp/slides-lifecycle-baseline.log
          grep -q 'Number of calls:' /tmp/slides-lifecycle-baseline.log
          echo "Baseline lifecycle regressions reproduced"

      - name: Apply exact production fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply-slides-lifecycle.py
          python /tmp/apply-slides-lifecycle.py
          git diff --check
          git diff -- apps/slides/src/renderer/ai/AiPanel.tsx

      - name: Regression tests after fix
        run: npm test -w @genoffice/slides -- ai-panel-run-lifecycle.test.ts

      - name: Slides typecheck
        run: npm run typecheck -w @genoffice/slides

      - name: Slides full test suite
        run: npm test -w @genoffice/slides

      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name 'desert-C'
          git config user.email '76146920+desert-C@users.noreply.github.com'
          git add apps/slides/src/renderer/ai/AiPanel.tsx
          git rm .github/workflows/apply-agent-lifecycle.yml
          git commit -m 'fix(slides): preserve agent runs across lifecycle boundaries'
          git push origin HEAD:dev_agent_lifecycle_apply
